{% extends "portal/base.html" %}
{% block title %}Edit Student - MeetSync{% endblock %}
{% block content %}
<h4 class="fw-bold mb-3">Edit student: {{ student.name }}</h4>
<div class="card" style="max-width: 480px;">
    <div class="card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label small">{{ field.label }}</label>
                    {{ field }}
                    {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
                </div>
            {% endfor %}
            <button class="btn btn-primary">Save changes</button>
            <a class="btn btn-link" href="{% url 'teacher_students' %}">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
